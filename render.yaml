services:
  - type: web
    name: store-plus-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: store-plus-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: store-plus-storage
      mountPath: /var/data/store-plus
      sizeGB: 10
databases:
  - name: store-plus-db
    plan: basic-256mb
