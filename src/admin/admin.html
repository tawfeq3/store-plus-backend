admin.html


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Store Plus - لوحة التحكم</title>

  <link
    rel="stylesheet"
    href="/admin/admin.css"
  >
</head>

<body>

  <!-- =========================
       Login
  ========================== -->

  <div
    id="loginPage"
    class="page"
  >
    <div class="card login-card">

      <h1>Store Plus</h1>

      <p>
        لوحة التحكم
      </p>

      <input
        id="username"
        type="text"
        placeholder="اسم المستخدم"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="login()"
      >
        دخول
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </div>
  </div>


  <!-- =========================
       Dashboard
  ========================== -->

  <div
    id="dashboard"
    class="hidden"
  >

    <header>

      <div>
        <h1>
          Store Plus
        </h1>

        <span>
          لوحة التحكم
        </span>
      </div>

      <button
        class="logout"
        type="button"
        onclick="logout()"
      >
        تسجيل الخروج
      </button>

    </header>


    <main>

      <!-- =========================
           Statistics
      ========================== -->

      <section class="stats">

        <div class="stat">
          <span>
            المستخدمون
          </span>

          <strong id="usersCount">
            0
          </strong>
        </div>


        <div class="stat">
          <span>
            التطبيقات
          </span>

          <strong id="appsCount">
            0
          </strong>
        </div>


        <div class="stat">
          <span>
            التنزيلات
          </span>

          <strong id="downloadsCount">
            0
          </strong>
        </div>


        <div class="stat">
          <span>
            طلبات التثبيت
          </span>

          <strong id="jobsCount">
            0
          </strong>
        </div>

      </section>


      <!-- =========================
           Add Application
      ========================== -->

      <section class="card">

        <div class="section-title">

          <h2>
            إضافة تطبيق
          </h2>

        </div>


        <form
          id="addAppForm"
          enctype="multipart/form-data"
        >

          <div class="form-grid">

            <input
              id="appName"
              name="name"
              placeholder="اسم التطبيق"
              required
            >


            <input
              id="appVersion"
              name="version"
              placeholder="الإصدار"
              required
            >


            <input
              id="appCategory"
              name="category"
              placeholder="التصنيف"
              required
            >


            <input
              id="appBundleId"
              name="bundle_id"
              placeholder="Bundle ID مثال: com.example.app"
              required
            >


            <input
              id="appIcon"
              name="iconURL"
              type="url"
              placeholder="رابط الأيقونة"
            >


            <input
              id="appDescription"
              name="description"
              class="wide"
              placeholder="وصف التطبيق"
              required
            >


            <label>
              ملف التطبيق IPA
            </label>


            <input
              id="appIPA"
              name="ipa"
              type="file"
              accept=".ipa,application/octet-stream"
              required
            >


            <label class="checkbox">

              <input
                id="appFeatured"
                name="featured"
                type="checkbox"
              >

              تطبيق مميز

            </label>

          </div>


          <button
            type="submit"
          >
            إضافة التطبيق
          </button>

        </form>


        <div
          id="appMessage"
        ></div>

      </section>


      <!-- =========================
           Certificate Upload
      ========================== -->

      <section class="card">

        <div class="section-title">

          <h2>
            إضافة شهادة لمستخدم
          </h2>

        </div>


        <form
          id="certificateForm"
          enctype="multipart/form-data"
        >

          <div class="form-grid">

            <!-- User -->

            <select
              id="certificateUser"
              name="userID"
              required
            >
              <option value="">
                اختر المستخدم
              </option>
            </select>


            <!-- Label -->

            <input
              id="certificateLabel"
              name="label"
              type="text"
              placeholder="اسم الشهادة"
              value="Certificate"
              required
            >


            <!-- P12 -->

            <label>
              ملف شهادة P12
            </label>

            <input
              id="certificateP12"
              name="p12"
              type="file"
              accept=".p12,.pfx,application/x-pkcs12"
              required
            >


            <!-- P12 Password -->

            <input
              id="certificateP12Password"
              name="p12Password"
              type="password"
              placeholder="كلمة مرور شهادة P12"
              autocomplete="new-password"
              required
            >


            <!-- Mobile Provision -->

            <label>
              ملف MobileProvision
            </label>

            <input
              id="certificateProvision"
              name="mobileprovision"
              type="file"
              accept=".mobileprovision"
              required
            >

          </div>


          <button
            type="submit"
          >
            حفظ الشهادة
          </button>

        </form>


        <div
          id="certificateMessage"
        ></div>

      </section>


      <!-- =========================
           Apps
      ========================== -->

      <section class="card">

        <div class="section-title">

          <h2>
            التطبيقات
          </h2>

          <button
            type="button"
            onclick="loadApps()"
          >
            تحديث
          </button>

        </div>


        <div
          id="appsList"
        >
          جاري التحميل...
        </div>

      </section>


      <!-- =========================
           Users
      ========================== -->

      <section class="card">

        <div class="section-title">

          <h2>
            المستخدمون
          </h2>

          <button
            type="button"
            onclick="loadUsers()"
          >
            تحديث
          </button>

        </div>


        <div
          id="usersList"
        >
          جاري التحميل...
        </div>

      </section>

    </main>

  </div>


  <script
    src="/admin/admin.js"
  ></script>

</body>
</html>
